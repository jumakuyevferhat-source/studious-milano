<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studious Milano | Men's Fashion — New Season</title>
<meta name="description" content="Studious Milano by NewYork Kids. Luxury menswear for a new generation. Worldwide shipping, easy ordering via WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studious Milano">
<meta property="og:title" content="Studious Milano — Luxury Menswear">
<meta property="og:description" content="New season collection. Worldwide shipping · Order via WhatsApp.">
<meta property="og:image" content="assets/urunler/beyaz-sweat-model.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111010">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23111010%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27800%27 font-size=%2720%27 fill=%27%23f4efe8%27 text-anchor=%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div class="topbar">
  <div class="topbar-track">
    <span data-i18n="top.1"></span><i>✦</i>
    <span data-i18n="top.2"></span><i>✦</i>
    <span data-i18n="top.3"></span><i>✦</i>
    <span data-i18n="top.1"></span><i>✦</i>
    <span data-i18n="top.2"></span><i>✦</i>
    <span data-i18n="top.3"></span><i>✦</i>
  </div>
</div>

<header class="header" id="header">
  <div class="container nav">
    <a href="#top" class="logo" data-i18n-aria="aria.home">
      <span class="logo-main">STUDIOUS</span>
      <span class="logo-sub"><b></b>MILANO<b></b></span>
    </a>
    <nav class="menu" id="menu">
      <a href="#kategoriler" data-i18n="nav.cats"></a>
      <a href="#koleksiyon" data-i18n="nav.coll"></a>
      <a href="#lookbook" data-i18n="nav.look"></a>
      <a href="#siparis" data-i18n="nav.order"></a>
      <a href="#iletisim" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-actions">
      <div class="lang" id="lang" role="group" data-i18n-aria="aria.lang"></div>
      <a class="btn btn-dark btn-sm wa-link" href="#" data-wa="wa.general">
        <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
        <span data-i18n="nav.wa"></span>
      </a>
      <button class="burger" id="burger" data-i18n-aria="aria.menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="top">

<!-- HERO -->
<section class="hero" id="hero" aria-roledescription="carousel" data-i18n-aria="aria.featured">
  <div class="hero-text">
    <div class="hero-slides-text" id="heroText"></div>
    <ul class="hero-meta">
      <li><strong>EU · US · RU</strong><span data-i18n="hero.m1"></span></li>
      <li><strong data-i18n="hero.m2v"></strong><span data-i18n="hero.m2"></span></li>
      <li><strong>24/7</strong><span data-i18n="hero.m3"></span></li>
    </ul>
  </div>
  <div class="hero-media" id="heroMedia">
    <div class="hero-parallax" id="heroParallax"></div>
    <div class="hero-shade"></div>
    <div class="hero-card" id="heroCard"></div>
    <div class="hero-nav">
      <div class="hero-dots" id="heroDots"></div>
      <div class="hero-arrows">
        <button type="button" id="heroPrev" data-i18n-aria="aria.prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" id="heroNext" data-i18n-aria="aria.next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
</section>

<!-- BIG MARQUEE -->
<div class="bigmarquee" aria-hidden="true">
  <div class="bigmarquee-track">
    <span>STUDIOUS</span><em>milano</em><span>NEW SEASON</span><em>street edit</em>
    <span>STUDIOUS</span><em>milano</em><span>NEW SEASON</span><em>street edit</em>
  </div>
</div>

<!-- CATEGORIES -->
<section class="section" id="kategoriler">
  <div class="container">
    <div class="section-head split">
      <div>
        <p class="eyebrow" data-i18n="cats.eyebrow"></p>
        <h2 data-i18n="cats.title"></h2>
      </div>
      <p class="muted" data-i18n="cats.text"></p>
    </div>
    <div class="cats" id="cats"></div>
  </div>
</section>

<!-- CATALOG -->
<section class="section section-stone" id="koleksiyon">
  <div class="container">
    <div class="section-head split">
      <div>
        <p class="eyebrow" data-i18n="coll.eyebrow"></p>
        <h2 data-i18n="coll.title"></h2>
      </div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="search" data-i18n-ph="coll.search" data-i18n-aria="coll.search">
        </label>
        <select id="sort" data-i18n-aria="coll.sort">
          <option value="default" data-i18n="sort.default"></option>
          <option value="price-asc" data-i18n="sort.pa"></option>
          <option value="price-desc" data-i18n="sort.pd"></option>
          <option value="new" data-i18n="sort.new"></option>
        </select>
      </div>
    </div>
    <div class="chips" id="chips" role="tablist" data-i18n-aria="filter.aria"></div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <p class="empty" id="empty" hidden><span data-i18n="empty.text"></span> <a href="#" class="wa-link" data-wa="wa.find" data-i18n="empty.link"></a></p>
  </div>
</section>

<!-- BRAND -->
<section class="brand">
  <div class="brand-media"><img src="assets/hero.jpg" data-i18n-alt="brand.alt" loading="lazy"></div>
  <div class="brand-text">
    <p class="eyebrow">Studious Milano</p>
    <h2 data-i18n-html="brand.title"></h2>
    <p data-i18n="brand.text"></p>
    <a href="#koleksiyon" class="btn btn-dark" data-i18n="brand.cta"></a>
  </div>
</section>

<!-- LOOKBOOK -->
<section class="section section-dark" id="lookbook">
  <div class="container">
    <div class="section-head split light">
      <div>
        <p class="eyebrow">Lookbook</p>
        <h2 data-i18n="look.title"></h2>
      </div>
      <p data-i18n="look.text"></p>
    </div>
    <div class="look">
      <figure class="look-a"><img src="assets/urunler/beyaz-sweat-model.jpg" data-i18n-alt="look.a1" loading="lazy" style="object-position:50% 25%"></figure>
      <figure class="look-b"><img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=800&h=1000&fit=crop&q=80&auto=format" data-i18n-alt="look.a2" loading="lazy"></figure>
      <blockquote class="look-q">
        <p data-i18n-html="look.quote"></p>
        <a href="#koleksiyon" class="btn btn-outline-light" data-i18n="look.cta"></a>
      </blockquote>
      <figure class="look-c"><img src="https://images.unsplash.com/photo-1488161628813-04466f872be2?w=800&h=1000&fit=crop&q=80&auto=format" data-i18n-alt="look.a3" loading="lazy"></figure>
      <figure class="look-d"><img src="https://images.unsplash.com/photo-1516826957135-700dedea698c?w=800&h=1000&fit=crop&q=80&auto=format" data-i18n-alt="look.a4" loading="lazy"></figure>
    </div>
  </div>
</section>

<!-- HOW TO ORDER -->
<section class="section" id="siparis">
  <div class="container">
    <div class="section-head center">
      <p class="eyebrow" data-i18n="order.eyebrow"></p>
      <h2 data-i18n="order.title"></h2>
    </div>
    <ol class="steps">
      <li><span class="step-n">01</span><h3 data-i18n="order.s1h"></h3><p data-i18n="order.s1p"></p></li>
      <li><span class="step-n">02</span><h3 data-i18n="order.s2h"></h3><p data-i18n="order.s2p"></p></li>
      <li><span class="step-n">03</span><h3 data-i18n="order.s3h"></h3><p data-i18n="order.s3p"></p></li>
    </ol>
    <div class="perks">
      <div><strong data-i18n="perk.1h"></strong><span data-i18n="perk.1p"></span></div>
      <div><strong data-i18n="perk.2h"></strong><span data-i18n="perk.2p"></span></div>
      <div><strong data-i18n="perk.3h"></strong><span data-i18n="perk.3p"></span></div>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="section section-stone" id="iletisim">
  <div class="container contact">
    <div class="contact-card">
      <p class="eyebrow" data-i18n="contact.eyebrow"></p>
      <h2 data-i18n-html="contact.title"></h2>
      <p class="muted" data-i18n="contact.text"></p>
      <a href="#" class="btn btn-dark wa-link" data-wa="wa.info">
        <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
        <span data-i18n="contact.cta"></span>
      </a>
    </div>
    <dl class="contact-list">
      <div><dt>WhatsApp</dt><dd><a href="#" class="wa-link wa-number" data-wa="wa.info"></a></dd></div>
      <div><dt>Instagram</dt><dd><a href="https://instagram.com/studiousmilano" target="_blank" rel="noopener">@studiousmilano</a></dd></div>
      <div><dt data-i18n="contact.store"></dt><dd data-i18n="contact.storeV"></dd></div>
      <div><dt data-i18n="contact.hours"></dt><dd data-i18n="contact.hoursV"></dd></div>
    </dl>
  </div>
</section>

<!-- WHATSAPP CTA -->
<section class="wa-cta">
  <div class="container wa-cta-inner">
    <div>
      <p class="eyebrow" data-i18n="cta.eyebrow"></p>
      <h2 data-i18n-html="cta.title"></h2>
      <p class="wa-cta-text" data-i18n="cta.text"></p>
    </div>
    <a href="#" class="wa-cta-btn wa-link" data-wa="wa.float">
      <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
      <span>
        <b data-i18n="cta.btn"></b>
        <small class="wa-number"></small>
      </span>
    </a>
  </div>
</section>

</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="logo logo-light">
      <span class="logo-main">STUDIOUS</span>
      <span class="logo-sub"><b></b>MILANO<b></b></span>
      <span class="logo-by">BY NEWYORK KIDS</span>
    </div>
    <nav class="footer-links" data-i18n-aria="footer.aria">
      <a href="#kategoriler" data-i18n="nav.cats"></a>
      <a href="#koleksiyon" data-i18n="nav.coll"></a>
      <a href="#lookbook" data-i18n="nav.look"></a>
      <a href="#siparis" data-i18n="nav.order"></a>
      <a href="#iletisim" data-i18n="nav.contact"></a>
    </nav>
    <div class="lang lang-footer" id="langFooter"></div>
    <p class="copy">© <span id="year"></span> Studious Milano. <span data-i18n="footer.rights"></span></p>
  </div>
</footer>

<!-- PRODUCT MODAL -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="modal-close" data-close data-i18n-aria="m.close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="modal-gallery">
      <div class="modal-main"><img id="mImg" alt=""></div>
      <div class="modal-thumbs" id="mThumbs"></div>
    </div>
    <div class="modal-info">
      <p class="eyebrow" id="mCat"></p>
      <h3 id="mName"></h3>
      <p class="m-code" id="mCode"></p>
      <p class="m-price" id="mPrice"></p>
      <p class="m-desc" id="mDesc"></p>
      <div class="opt">
        <span class="opt-label"><span data-i18n="m.color"></span>: <b id="mColorLabel"></b></span>
        <div class="opt-list" id="mColors"></div>
      </div>
      <div class="opt">
        <span class="opt-label"><span data-i18n="m.size"></span>: <b id="mSizeLabel"></b></span>
        <div class="opt-list" id="mSizes"></div>
      </div>
      <div class="opt">
        <span class="opt-label" data-i18n="m.qty"></span>
        <div class="qty">
          <button type="button" id="qMinus" data-i18n-aria="m.minus">−</button>
          <output id="qVal">1</output>
          <button type="button" id="qPlus" data-i18n-aria="m.plus">+</button>
        </div>
      </div>
      <p class="m-warn" id="mWarn" hidden data-i18n="m.warn"></p>
      <button class="btn btn-wa btn-block" id="mOrder">
        <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
        <span data-i18n="m.order"></span>
      </button>
      <ul class="m-perks">
        <li data-i18n="m.p1"></li>
        <li data-i18n="m.p2"></li>
        <li data-i18n="m.p3"></li>
      </ul>
    </div>
  </div>
</div>

<a href="#" class="wa-float wa-link" data-wa="wa.float" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
</a>

</body>
